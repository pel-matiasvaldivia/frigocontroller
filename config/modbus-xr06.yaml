# Perfil de dispositivo FrigoController
# ----------------------------------------------------------------------------
# Mapa de registros data-driven: el firmware lee este perfil desde NVS/OTA.
# Agregar un controlador nuevo (XR02/XR03, Eliwell IDPlus, Full Gauge MT-530)
# = agregar un archivo como este. NO se recompila el firmware.
#
# Todo valor con "verify: true" es provisorio y debe cerrarse con el
# procedimiento de docs/03-modbus-xr06.md §5 antes de liberar a produccion.

profile:
  id: copeland-dixell-xr06cx
  name: "Copeland / Dixell XR06CX"
  firmware_tested: "PENDIENTE — completar con la version del XR06 del banco"
  physical_layer: ttl_direct       # ttl_direct (FC-E, linea base) | xj485 (FC-R) | none (degradado)

serial:
  # El firmware autodetecta probando esta lista en orden y persiste la que responde.
  candidates:
    - { baud: 9600,  databits: 8, parity: none, stopbits: 2 }   # default esperado
    - { baud: 9600,  databits: 8, parity: even, stopbits: 1 }
    - { baud: 19200, databits: 8, parity: none, stopbits: 2 }
  slave_address: 1                 # parametro de direccion del XR06
  timeout_ms: 300
  inter_frame_delay_ms: 10
  retries: 2

poll_groups:
  - { name: status,    period_ms: 1000, points: [temp_p1, temp_p2, status_word] }
  - { name: setpoint,  period_ms: 10000, points: [setpoint] }
  - { name: inputs,    period_ms: 1000, points: [digital_inputs] }
  - { name: params,    period_ms: 300000, points: [hysteresis, sp_min, sp_max,
                                                   alarm_high, alarm_low, alarm_delay,
                                                   defrost_interval, defrost_max,
                                                   door_alarm_delay] }

points:
  temp_p1:
    label: "Temperatura de regulacion"
    fn: 0x04            # read input registers
    addr: 0x0000
    type: int16
    scale: 0.1
    unit: degC
    verify: true
  temp_p2:
    label: "Temperatura de evaporador"
    fn: 0x04
    addr: 0x0001
    type: int16
    scale: 0.1
    unit: degC
    optional: true      # ausente si P2P = n
    verify: true
  status_word:
    label: "Palabra de estado y flags"
    fn: 0x04
    addr: 0x0010
    type: bitfield16
    verify: true
    bits:               # TODOS los indices son provisorios
      0:  relay_compressor
      1:  relay_defrost
      2:  relay_fans
      3:  relay_light
      4:  defrost_active
      5:  drip_phase
      6:  fan_delay
      7:  standby
      8:  alarm_temp_high      # AH1
      9:  alarm_temp_low       # AL1
      10: alarm_probe_p1       # P1
      11: alarm_probe_p2       # P2
      12: alarm_door_open
      13: alarm_external
  digital_inputs:
    # Fuente primaria del estado de puerta cuando el fin de carrera esta cableado
    # al XR06 (i1F = dor). Si no lo esta, se usa la DI1 propia del gateway.
    label: "Entradas digitales del XR06"
    fn: 0x02            # read discrete inputs
    addr: 0x0000
    type: bitfield16
    verify: true
    bits:
      0: xr06_di1       # tipicamente puerta
      1: xr06_di2
  setpoint:
    label: "Consigna SET"
    fn_read: 0x03
    fn_write: 0x06
    addr: 0x0100
    type: int16
    scale: 0.1
    unit: degC
    writable: true
    clamp_to: [sp_min, sp_max]      # recorte duro a los limites del propio XR06
    write_policy: eeprom_guard      # ver §3.4 del doc 03
    verify: true
  hysteresis:        { label: "Hy",  fn_read: 0x03, fn_write: 0x06, addr: null, type: int16, scale: 0.1, unit: degC, verify: true }
  sp_min:            { label: "LS",  fn_read: 0x03, addr: null, type: int16, scale: 0.1, unit: degC, verify: true }
  sp_max:            { label: "US",  fn_read: 0x03, addr: null, type: int16, scale: 0.1, unit: degC, verify: true }
  alarm_high:        { label: "ALU", fn_read: 0x03, fn_write: 0x06, addr: null, type: int16, scale: 0.1, unit: degC, verify: true }
  alarm_low:         { label: "ALL", fn_read: 0x03, fn_write: 0x06, addr: null, type: int16, scale: 0.1, unit: degC, verify: true }
  alarm_delay:       { label: "ALd", fn_read: 0x03, fn_write: 0x06, addr: null, type: uint16, scale: 1, unit: min, verify: true }
  defrost_interval:  { label: "idF", fn_read: 0x03, fn_write: 0x06, addr: null, type: uint16, scale: 1, unit: h,   verify: true }
  defrost_max:       { label: "MdF", fn_read: 0x03, fn_write: 0x06, addr: null, type: uint16, scale: 1, unit: min, verify: true }
  door_alarm_delay:  { label: "dOA", fn_read: 0x03, fn_write: 0x06, addr: null, type: uint16, scale: 1, unit: min, verify: true }

commands:
  standby:
    label: "ON/OFF remoto (stand-by)"
    primary:   { fn: 0x05, addr: null, verify: true }        # camino A: Modbus
    fallback:  { type: relay, channel: 1, logic: nc_safe }   # camino B: rele -> entrada digital del XR06
    readback:  { point: status_word, bit: standby, timeout_s: 10 }
    on_mismatch: alarm_cmd_fail
  force_defrost:
    label: "Forzar deshielo"
    primary: { fn: 0x05, addr: null, verify: true }
    rate_limit: { max: 1, per_minutes: 30 }
  ack_alarm:
    label: "Silenciar alarma del controlador"
    primary: { fn: 0x05, addr: null, verify: true }

# ----------------------------------------------------------------------------
# Rev. 2: de donde sale cada dato. El equipo base no tiene sensores propios.
sources:
  temperature:     { primary: temp_p1, fallback: none }       # sin Modbus NO hay temperatura
  evaporator:      { primary: temp_p2, fallback: none }
  humidity:        { primary: accessory_sht45, fallback: none }  # ausente en el equipo base
  compressor_run:  { primary: status_word.relay_compressor, confirm: accessory_ct }
  defrost:         { primary: status_word.defrost_active }
  door:            { primary: digital_inputs.xr06_di1, fallback: gateway_di1 }
  onoff:           { primary: commands.standby, fallback: relay_1 }

# Accesorios: se declaran aqui y la app oculta la metrica si el accesorio no esta.
accessories:
  accessory_sht45:
    present: false        # SKU +HR
    bus: i2c
    period_ms: 30000
    heater: { on_s: 10, every_min: 60 }
  accessory_ct:
    present: false        # SKU +CT
    channel: adc0
    range_a: 10
  accessory_ds18b20:
    present: false        # sonda de producto
    bus: onewire

# Modo degradado: controlador sin puerto serie, o enlace en falla permanente.
# ATENCION: sin Modbus el equipo NO tiene temperatura. Solo sirve para
# instalaciones donde se acepta monitoreo por contactos, o con sonda accesorio.
degraded_mode:
  temperature_source: accessory_sht45   # unica opcion; si no esta, no hay dato
  compressor_state: accessory_ct
  door_state: gateway_di1
  onoff_control: relay_1
  xr06_alarm_contact: gateway_di2
  alarm_on_entry: comm_fail             # severidad alta
