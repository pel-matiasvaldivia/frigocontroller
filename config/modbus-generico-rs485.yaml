# Perfil de dispositivo FrigoController — CAMINO B (ModBUS RS-485)
# ----------------------------------------------------------------------------
# ATENCION: el Copeland/Dixell XR06CX NO soporta ModBUS (no tiene puerto serie
# de proceso ni parametro de direccion de esclavo). Ver docs/10 §1.
# Para ese controlador se usa config/perfil-xr06cx-envolvente.yaml.
#
# Este perfil es la PLANTILLA del camino B: controladores con ModBUS RTU, ya
# sea porque el cliente los tiene o porque se reemplaza el XR06CX para
# habilitar consigna remota. Candidatos relevados en docs/11:
#   - Danfoss ERC 213 (fw >= 4.16): mapa de registros PUBLICADO. Recomendado.
#     TTL a bordo -> requiere adaptador; su TTL RX exige >= 50 mA de drive.
#     Serie fija: 9600 8E1.
#   - Carel IR33+: RS-485 A BORDO (sin adaptador), autodeteccion ModBUS/CAREL.
#     Verificar reemplazo vigente: el IR33+ sale de catalogo.
#   - Eliwell/EVCO clase EV3294: hay variantes con RS-485 a bordo. Pedir el
#     numero de parte exacto.
#   - Dixell XW/XR: requiere XJ485-CX y Emerson no publica los registros.
#   - Full Gauge: NO sirve. Su RS-485 usa protocolo propietario Sitrad.
# Agregar un controlador = agregar un archivo como este; no se recompila.
#
# Todo valor con "verify: true" debe cerrarse contra el manual del controlador
# concreto y el banco (procedimiento de docs/03 §5) antes de produccion.

profile:
  id: plantilla-modbus-rs485
  name: "Plantilla ModBUS RTU (camino B)"
  strategy: modbus
  controller_model: "PENDIENTE — completar con el controlador elegido"
  firmware_tested: "PENDIENTE"
  physical_layer: rs485            # rs485 (a bordo) | ttl_adapter (TTL + conversor)
  # La poblacion FC-R lleva las dos salidas: bornera A/B y puerto TTL con
  # driver de >= 50 mA, porque la mayoria de los candidatos usa TTL.

serial:
  # El firmware autodetecta probando esta lista en orden y persiste la que responde.
  candidates:
    - { baud: 9600,  databits: 8, parity: even, stopbits: 1 }   # Danfoss ERC 21x (fijo)
    - { baud: 9600,  databits: 8, parity: none, stopbits: 2 }   # familia Dixell
    - { baud: 9600,  databits: 8, parity: none, stopbits: 1 }
    - { baud: 19200, databits: 8, parity: none, stopbits: 2 }
  slave_address: 1                 # parametro de direccion del XR06
  timeout_ms: 300
  inter_frame_delay_ms: 10
  retries: 2

poll_groups:
  - { name: status,    period_ms: 1000, points: [temp_p1, temp_p2, status_word] }
  - { name: setpoint,  period_ms: 10000, points: [setpoint] }
  - { name: inputs,    period_ms: 1000, points: [digital_inputs] }
  - { name: params,    period_ms: 300000, points: [hysteresis, sp_min, sp_max,
                                                   alarm_high, alarm_low, alarm_delay,
                                                   defrost_interval, defrost_max,
                                                   door_alarm_delay] }

points:
  temp_p1:
    label: "Temperatura de regulacion"
    fn: 0x04            # read input registers
    addr: 0x0000
    type: int16
    scale: 0.1
    unit: degC
    verify: true
  temp_p2:
    label: "Temperatura de evaporador"
    fn: 0x04
    addr: 0x0001
    type: int16
    scale: 0.1
    unit: degC
    optional: true      # ausente si P2P = n
    verify: true
  status_word:
    label: "Palabra de estado y flags"
    fn: 0x04
    addr: 0x0010
    type: bitfield16
    verify: true
    bits:               # TODOS los indices son provisorios
      0:  relay_compressor
      1:  relay_defrost
      2:  relay_fans
      3:  relay_light
      4:  defrost_active
      5:  drip_phase
      6:  fan_delay
      7:  standby
      8:  alarm_temp_high      # AH1
      9:  alarm_temp_low       # AL1
      10: alarm_probe_p1       # P1
      11: alarm_probe_p2       # P2
      12: alarm_door_open
      13: alarm_external
  digital_inputs:
    # Fuente primaria del estado de puerta cuando el fin de carrera esta cableado
    # al XR06 (i1F = dor). Si no lo esta, se usa la DI1 propia del gateway.
    label: "Entradas digitales del XR06"
    fn: 0x02            # read discrete inputs
    addr: 0x0000
    type: bitfield16
    verify: true
    bits:
      0: xr06_di1       # tipicamente puerta
      1: xr06_di2
  setpoint:
    label: "Consigna SET"
    fn_read: 0x03
    fn_write: 0x06
    addr: 0x0100
    type: int16
    scale: 0.1
    unit: degC
    writable: true
    clamp_to: [sp_min, sp_max]      # recorte duro a los limites del propio XR06
    write_policy: eeprom_guard      # ver §3.4 del doc 03
    verify: true
  hysteresis:        { label: "Hy — diferencial",  fn_read: 0x03, fn_write: 0x06, addr: null, type: int16, scale: 0.1, unit: degC, verify: true }
  sp_min:            { label: "LS — set point minimo",  fn_read: 0x03, addr: null, type: int16, scale: 0.1, unit: degC, verify: true }
  sp_max:            { label: "uS — set point maximo",  fn_read: 0x03, addr: null, type: int16, scale: 0.1, unit: degC, verify: true }
  alarm_high:        { label: "AU — alarma de maxima", fn_read: 0x03, fn_write: 0x06, addr: null, type: int16, scale: 0.1, unit: degC, verify: true }
  alarm_low:         { label: "AL — alarma de minima", fn_read: 0x03, fn_write: 0x06, addr: null, type: int16, scale: 0.1, unit: degC, verify: true }
  alarm_delay:       { label: "Ad — retardo de alarma", fn_read: 0x03, fn_write: 0x06, addr: null, type: uint16, scale: 1, unit: min, verify: true }
  defrost_interval:  { label: "id — intervalo entre deshielos", fn_read: 0x03, fn_write: 0x06, addr: null, type: uint16, scale: 1, unit: h,   verify: true }
  defrost_max:       { label: "Md — duracion maxima de deshielo", fn_read: 0x03, fn_write: 0x06, addr: null, type: uint16, scale: 1, unit: min, verify: true }
  door_alarm_delay:  { label: "di — retardo de alarma de entrada digital", fn_read: 0x03, fn_write: 0x06, addr: null, type: uint16, scale: 1, unit: min, verify: true }

commands:
  standby:
    label: "ON/OFF remoto (stand-by)"
    primary:   { fn: 0x05, addr: null, verify: true }        # camino A: Modbus
    fallback:  { type: relay, channel: 1, logic: nc_safe }   # camino B: rele -> entrada digital del XR06
    readback:  { point: status_word, bit: standby, timeout_s: 10 }
    on_mismatch: alarm_cmd_fail
  force_defrost:
    label: "Forzar deshielo"
    primary: { fn: 0x05, addr: null, verify: true }
    rate_limit: { max: 1, per_minutes: 30 }
  ack_alarm:
    label: "Silenciar alarma del controlador"
    primary: { fn: 0x05, addr: null, verify: true }

# ----------------------------------------------------------------------------
# Rev. 2: de donde sale cada dato. El equipo base no tiene sensores propios.
sources:
  temperature:     { primary: temp_p1, fallback: none }       # sin Modbus NO hay temperatura
  evaporator:      { primary: temp_p2, fallback: none }
  humidity:        { primary: accessory_sht45, fallback: none }  # ausente en el equipo base
  compressor_run:  { primary: status_word.relay_compressor, confirm: accessory_ct }
  defrost:         { primary: status_word.defrost_active }
  door:            { primary: digital_inputs.xr06_di1, fallback: gateway_di1 }
  onoff:           { primary: commands.standby, fallback: relay_1 }

# Accesorios: se declaran aqui y la app oculta la metrica si el accesorio no esta.
accessories:
  accessory_sht45:
    present: false        # SKU +HR
    bus: i2c
    period_ms: 30000
    heater: { on_s: 10, every_min: 60 }
  accessory_ct:
    present: false        # SKU +CT
    channel: adc0
    range_a: 10
  accessory_ds18b20:
    present: false        # sonda de producto
    bus: onewire

# Modo degradado: enlace en falla permanente (en el camino B el gateway tambien
# lleva su sonda propia, justamente para no quedarse ciego).
# ATENCION: sin Modbus el equipo NO tiene temperatura. Solo sirve para
# instalaciones donde se acepta monitoreo por contactos, o con sonda accesorio.
degraded_mode:
  temperature_source: accessory_sht45   # unica opcion; si no esta, no hay dato
  compressor_state: accessory_ct
  door_state: gateway_di1
  onoff_control: relay_1
  xr06_alarm_contact: gateway_di2
  alarm_on_entry: comm_fail             # severidad alta
